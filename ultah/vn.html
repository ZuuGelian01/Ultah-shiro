<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ucapan Ulang Tahun 🎉</title>
  <link rel="stylesheet" href="css/vn.css">
  <link rel="icon" type="image/x-icon" href="img/Akane.jpeg"
    style="width: 150px; height: 150px; border-radius: 50%; object-fit: cover;">
</head>

<body>
  <canvas id="universe"></canvas>
  <canvas id="confetti"></canvas>
  <div class="main-container">
    <h1>🎂 Selamat Ulang Tahun Shiro 🎂</h1>
    <p>
      Kami semua ingin mengucapkan selamat ulang tahun Shiro.
      Semoga panjang umur, sehat selalu, dan semua harapanmu bisa tercapai.
      Dengarkan pesan suara dari kami 💝
    </p>

    <!-- Voice Note Cards -->
    <div class="vn-container">
      <div class="vn-card">
        <div class="vn-title">Pesan dari Zuu</div>
        <div class="player">
          <button class="play-btn" data-audio="sound/Zuu-Ucapan.mp3">▶</button>
          <div class="wave">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
          </div>
        </div>
        <!-- Wa Zuu -->
        <a href="https://wa.me/6289507720402" target="_blank" class="whatsapp-btn">
          <img src="img/wa.png" alt="WhatsApp"> No Mas Dani 😎
        </a>
      </div>

      <div class="vn-card">
        <div class="vn-title">Pesan dari Mikael</div>
        <div class="player">
          <button class="play-btn" data-audio="sound/mikael.opus">▶</button>
          <div class="wave">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
          </div>
        </div>
        <!-- Wa Mikael -->
        <a href="https://wa.me/6287786590708" target="_blank" class="whatsapp-btn">
          <img src="img/wa.png" alt="WhatsApp"> No Mikael Si Anomali 🤓
        </a>
      </div>
    </div>

    <!-- Dekorasi Balon & Kue -->
    <div class="decor balloon" style="left: 10%;">🎁</div>
    <div class="decor balloon" style="left: 25%; animation-delay: 3s;">🎉</div>
    <div class="decor" style="left: 50%; animation-delay: 6s;">🎂</div>
    <div class="decor balloon" style="left: 70%; animation-delay: 2s;">✨</div>
    <div class="decor balloon" style="left: 85%; animation-delay: 5s;">🎈</div>

    <!-- Tombol ke aib.html -->
    <div class="aib-button-container">
      <a href="aib.html" class="aib-btn">Lihat Halaman AIB</a>
    </div>

    <script src="js/vn.js"></script>
</body>
</html>
